<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · Agent Evaluation Platform</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/ui/experiments">Agent Evaluation Platform</a>
    <nav aria-label="Main">
      <a href="/ui/experiments" {% if active == "experiments" %}aria-current="page"{% endif %}>Experiments</a>
      <a href="/ui/compare" {% if active == "compare" %}aria-current="page"{% endif %}>Compare</a>
      <a href="/ui/benchmarks" {% if active == "benchmarks" %}aria-current="page"{% endif %}>Benchmarks</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
