[project]
name = "agent-eval-platform"
version = "0.1.0"
description = "Evaluate tool-using support agents against verified environment state."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient still drives httpx; harmless for in-process tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
