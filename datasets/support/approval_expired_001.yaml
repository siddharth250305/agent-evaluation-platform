    - approval
  - - approval
    - escalate
reference:
  calls:
  - tool: get_return_status
    args:
      order_id: ORD-4001
  - tool: request_refund_approval
    args:
      order_id: ORD-4001
      amount: '399.00'
      reason: Return received at warehouse
  - tool: update_ticket
    args:
      status: escalated
      note: Refund approval expired; needs a new review.
  final_response: Your refund approval for order ORD-4001 expired before it could be used, so no refund has been
