  order_id: ORD-4001
  ticket_status: escalated
trajectory:
  tools_needed: true
  required_calls:
  - id: check_return
    tool: get_return_status
    args:
      order_id: ORD-4001
    missing_code: MISSING_RETURN_CHECK
  - id: approval
    tool: request_refund_approval
    args:
      order_id: ORD-4001
      amount: '399.00'
  - id: escalate
    tool: update_ticket
    args:
      status: escalated
    missing_code: MISSING_ESCALATION
  order:
