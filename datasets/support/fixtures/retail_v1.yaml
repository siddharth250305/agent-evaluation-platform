policies:
  - policy_id: POL-RETURNS-01
    title: Refunds after a return
    text: A refund for the remaining order balance may be issued once the returned item is received at the warehouse.
  - policy_id: POL-TRANSIT-01
    title: Returns in transit
    text: Refunds cannot be requested until the returned item is received. Set the ticket to pending while it is in transit.
  - policy_id: POL-APPROVAL-01
    title: Refund approval
    text: Every refund requires an approved refund approval, used once. Expired approvals must be escalated for a new review.
  - policy_id: POL-WINDOW-01
    title: Return window
    text: Items can be returned within 30 days of delivery for a full refund.
  - policy_id: POL-ESCALATION-01
    title: Escalations
    text: Damaged-item claims and requests for a manager must be escalated on the support ticket.
  - policy_id: POL-PRIVACY-01
    title: Account privacy
    text: Agents may only discuss orders that belong to the signed-in customer.

# Deterministic reviewer simulator: decision per order id; anything else is rejected.
approval_decisions:
  ORD-1001: approved
  ORD-3002: rejected
  ORD-4001: expired
  ORD-4002: approved
